name: CI Test Suite

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: test_user
                    POSTGRES_PASSWORD: test_password
                    POSTGRES_DB: test_clinical_db
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        
        
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
                cache: "pip"
            
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Apply database migrations
              env:
                PGPASSWORD: test_password
              run: |
                psql -h 127.0.0.1 -p 5432 -U test_user -d test_clinical_db -f db/schema.sql

            - name: Run test suite
              env:
                # altered database URL to check if the tests can connect to the database
                DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/test_clinical_db
              run: |
                pytest tests/ -v